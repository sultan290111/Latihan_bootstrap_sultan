<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Website Profil Pribadi</title>

    <!-- CDN CSS Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>
  <!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container d-flex justify-content-between align-items-center">

        <!-- Tulisan di sebelah kiri -->
        <a class="navbar-brand fw-bold" href="#">
            CV SULTAN
        </a>

        <!-- Tombol garis tiga di sebelah kanan -->
        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuNavbar"
            aria-controls="menuNavbar"
            aria-expanded="false"
            aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Menu navigasi -->
        <div class="collapse navbar-collapse" id="menuNavbar">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="#home">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#menu">Menu</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#about">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#kontak">Kontak</a>
                </li>
            </ul>
        </div>

    </div>
</nav>

    <!-- CAROUSEL FOTO -->
<div id="carouselExampleRide" class="carousel slide mb-4"
     data-bs-ride="carousel" data-bs-interval="3000">

    <div class="carousel-inner">
        <div class="carousel-item active">
            <img src="saya.jpg" class="d-block mx-auto"
                 style="width:50%; height:350px; object-fit:cover;"
                 alt="Foto 1">
        </div>

        <div class="carousel-item">
            <img src="dia.jpg" class="d-block mx-auto"
                 style="width:50%; height:350px; object-fit:cover;"
                 alt="Foto 2">
        </div>

        <div class="carousel-item">
            <img src="aku.jpg" class="d-block mx-auto"
                 style="width:50%; height:350px; object-fit:cover;"
                 alt="Foto 3">
        </div>
    </div>

    <div class="carousel-indicators position-static mt-3">
        <button type="button" data-bs-target="#carouselExampleRide"
                data-bs-slide-to="0" class="active bg-dark"
                aria-label="Foto 1" aria-current="true"></button>
        <button type="button" data-bs-target="#carouselExampleRide"
                data-bs-slide-to="1" class="bg-dark"
                aria-label="Foto 2"></button>
        <button type="button" data-bs-target="#carouselExampleRide"
                data-bs-slide-to="2" class="bg-dark"
                aria-label="Foto 3"></button>
    </div>

    <button class="carousel-control-prev" type="button"
            data-bs-target="#carouselExampleRide" data-bs-slide="prev">
        <span class="carousel-control-prev-icon bg-dark rounded"></span>
        <span class="visually-hidden">Sebelumnya</span>
    </button>

    <button class="carousel-control-next" type="button"
            data-bs-target="#carouselExampleRide" data-bs-slide="next">
        <span class="carousel-control-next-icon bg-dark rounded"></span>
        <span class="visually-hidden">Selanjutnya</span>
  </button>
</div>

<!-- CDN JavaScript Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
